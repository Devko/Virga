name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # R4-07, R6-03, R6-04: every version in pnpm-lock.yaml, and the pnpm version
  # in package.json packageManager, was published at least 14 days ago, and
  # each locked integrity is the registry's, in the strongest algorithm the
  # registry publishes (TM-32). minimumReleaseAge does not apply to an install
  # from the lockfile, and pnpm/action-setup installs the pnpm that
  # packageManager names (so it gets no version input), so every job that
  # installs needs this one. R8-01, R9-01, TM-29: pnpm-workspace.yaml and the
  # root .npmrc hold only the settings the check knows, and package.json no
  # pnpm settings; others make pnpm install config dependencies, install from
  # another lockfile (lockfile-dir), download a Node.js runtime or run code.
  # R8-02, R9-02, L-1: only the root package.json names the package manager,
  # only the root holds pnpm-workspace.yaml and .npmrc, and no directory holds
  # .corepack.env, however a case-insensitive file system would spell them,
  # since corepack and pnpm read them from the directory a command runs in.
  # H-1: no continue-on-error or other key here that lets the check fail
  # without failing this job, and no if: on an installing job that runs it
  # after this job failed. The only job that needs the registry; it installs
  # nothing and runs no package code. Node.js is the exact version in .nvmrc.
  release-age:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-release-age.ts --fresh-checkout

  check:
    needs: release-age
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm rules:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:scripts

  # Bundles every Worker with `wrangler deploy --dry-run` and checks the
  # configs against each other. Uses no Cloudflare credentials. Needs check
  # too (R8-04, R8-05), so one green deploy-dry-run status also covers lint,
  # rules:check, typecheck and the tests: the deploy ships the committed
  # rules.gen.ts, which only rules:check compares with the compiler output.
  deploy-dry-run:
    needs: [release-age, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/deploy.ts --dry-run
