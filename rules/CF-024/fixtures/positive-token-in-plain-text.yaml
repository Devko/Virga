# Source: https://developers.cloudflare.com/api/resources/workers/subresources/scripts/subresources/versions/methods/get/
# Binding shapes (plain_text, secret_text): https://developers.cloudflare.com/workers/configuration/multipart-upload-metadata/
# Graph shape: docs/architecture/graph-contract.md, worker_version.plain_text_vars
description: >
  The deployed version keeps a Cloudflare API token in a plain-text variable
  next to a harmless one. An older version behind a version URL holds an AWS
  access key. Both land in one finding for the Worker.
nodes:
  - { type: worker_script, id: billing, name: billing, props: { workers_dev: false, preview_urls: true } }
  - type: worker_version
    id: 4a1c0f6e-2b0d-4c51-9a55-0d1f0c2a7b10
    name: "12"
    props:
      script_node_id: "worker_script:billing"
      number: 12
      plain_text_vars:
        - { name: CF_API_TOKEN, looks_secret: true, secret_pattern: cfat_ }
        - { name: LOG_LEVEL, looks_secret: false, secret_pattern: null }
      secret_names: [STRIPE_KEY]
  - type: worker_version
    id: 9e0b3c2d-1f4a-4e6b-8c7d-5a6b7c8d9e0f
    name: "9"
    props:
      script_node_id: "worker_script:billing"
      number: 9
      plain_text_vars:
        - { name: AWS_KEY_ID, looks_secret: true, secret_pattern: aws_access_key }
      secret_names: []
  - type: worker_preview_url
    id: 9e0b3c2d-billing.example.workers.dev
    name: 9e0b3c2d-billing.example.workers.dev
    props: { script: billing, kind: version, version_id: 9e0b3c2d-1f4a-4e6b-8c7d-5a6b7c8d9e0f, alias: null }
edges:
  - { type: DEPLOYS, src: "worker_script:billing", dst: "worker_version:4a1c0f6e-2b0d-4c51-9a55-0d1f0c2a7b10", props: { percentage: 100 } }
  - { type: ROUTES_TO, src: "worker_preview_url:9e0b3c2d-billing.example.workers.dev", dst: "worker_version:9e0b3c2d-1f4a-4e6b-8c7d-5a6b7c8d9e0f" }
expect:
  - { fingerprint: "CF-024:worker_script:billing", severity: medium }
