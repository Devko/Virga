# Source: https://developers.cloudflare.com/api/resources/workers/subresources/scripts/subresources/versions/methods/get/
# Binding shapes: https://developers.cloudflare.com/workers/configuration/multipart-upload-metadata/
# Graph shape: docs/architecture/graph-contract.md, worker_version.plain_text_vars and secret_names
description: >
  The token is a secret_text binding, and the plain-text variables hold
  values the collector did not flag.
nodes:
  - { type: worker_script, id: billing, name: billing }
  - type: worker_version
    id: v1
    props:
      script_node_id: "worker_script:billing"
      plain_text_vars:
        - { name: LOG_LEVEL, looks_secret: false, secret_pattern: null }
        - { name: ACCOUNT_ID, looks_secret: false, secret_pattern: null }
      secret_names: [CF_API_TOKEN]
edges:
  - { type: DEPLOYS, src: "worker_script:billing", dst: "worker_version:v1", props: { percentage: 100 } }
expect: []
