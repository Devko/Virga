description: The data store binding was removed (tombstoned) in a later scan.
nodes:
  - { type: worker_route, id: r-j, name: "j.example.com/*" }
  - { type: worker_script, id: j, name: j }
  - { type: worker_version, id: j1, props: { script_node_id: "worker_script:j" } }
  - { type: package, id: "pkg:npm/lodash@4.17.20", name: lodash }
  - { type: d1_database, id: main, name: main }
edges:
  - { type: ROUTES_TO, src: "worker_route:r-j", dst: "worker_script:j" }
  - { type: DEPLOYS, src: "worker_script:j", dst: "worker_version:j1", props: { percentage: 100 } }
  - { type: CONTAINS, src: "worker_version:j1", dst: "package:pkg:npm/lodash@4.17.20", props: { confidence: 2 } }
  - { type: BINDS, src: "worker_version:j1", dst: "d1_database:main", key: DB, deleted: true }
exposure:
  - { entry: "worker_route:r-j", decision: public, confidence: 2 }
vulns:
  - { package: "package:pkg:npm/lodash@4.17.20", id: GHSA-test-crit, severity: critical }
expect: []
