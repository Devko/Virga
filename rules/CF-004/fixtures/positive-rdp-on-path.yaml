  - { type: tunnel_hostname, id: "5d0e7b9a-2c4f-4a61-8e3d-b7f9c0a1d2e3:remote.example.com/desk", name: remote.example.com, props: { hostname: remote.example.com, path: /desk, service: "rdp://10.0.0.5:3389", origin_scheme: rdp, tunnel_id: 5d0e7b9a-2c4f-4a61-8e3d-b7f9c0a1d2e3, access_required: false } }
edges:
