# Source: https://developers.cloudflare.com/cloudflare-one/networks/connectors/cloudflare-tunnel/configure-tunnels/origin-parameters/#access
# (originRequest.access.required: cloudflared rejects requests without a valid Access token)
# Graph shape: docs/architecture/graph-contract.md, tunnel_hostname.access_required and
# "Exposure semantics", item 4 (origin-enforced Access)
description: >
  cloudflared requires an Access token for both hostnames. No Access app
  covers the SSH hostname, and a Bypass for everyone covers the wiki; Access
  alone would leave both public. The evaluator decides them access with
  confidence 1, decided by the tunnel hostname, and CF-004 follows the
  exposure rows.
nodes:
  - { type: tunnel, id: c1744f8b-faa1-48a4-9e5c-02ac921467fa, name: office, props: { tunnel_type: cfd_tunnel, status: healthy, config_src: cloudflare } }
  - { type: tunnel_hostname, id: "c1744f8b-faa1-48a4-9e5c-02ac921467fa:ssh.example.com", name: ssh.example.com, props: { hostname: ssh.example.com, path: "", service: "ssh://localhost:22", origin_scheme: ssh, tunnel_id: c1744f8b-faa1-48a4-9e5c-02ac921467fa, access_required: true, via_fallthrough: false } }
  - { type: tunnel_hostname, id: "c1744f8b-faa1-48a4-9e5c-02ac921467fa:wiki.example.com", name: wiki.example.com, props: { hostname: wiki.example.com, path: "", service: "http://localhost:8080", origin_scheme: http, tunnel_id: c1744f8b-faa1-48a4-9e5c-02ac921467fa, access_required: true, via_fallthrough: false } }
  - type: access_app
    id: app-wiki
    name: Wiki
    props: { app_type: self_hosted, targets: [{ kind: hostname, host: wiki.example.com, path: "", overrides: [] }], session_duration: 24h, allowed_idps: [] }
  - { type: access_policy, id: pol-public, name: Public, props: { decision: bypass, include: [{ kind: everyone, value: null }], require: [], exclude: [], session_duration: null } }
edges:
  - { type: ROUTES_TO, src: "tunnel_hostname:c1744f8b-faa1-48a4-9e5c-02ac921467fa:ssh.example.com", dst: "tunnel:c1744f8b-faa1-48a4-9e5c-02ac921467fa" }
  - { type: ROUTES_TO, src: "tunnel_hostname:c1744f8b-faa1-48a4-9e5c-02ac921467fa:wiki.example.com", dst: "tunnel:c1744f8b-faa1-48a4-9e5c-02ac921467fa" }
  - { type: ALLOWS, src: "access_policy:pol-public", dst: "access_app:app-wiki", props: { precedence: 1 } }
exposure:
  - { entry: "tunnel_hostname:c1744f8b-faa1-48a4-9e5c-02ac921467fa:ssh.example.com", decision: access, confidence: 1 }
  - { entry: "tunnel_hostname:c1744f8b-faa1-48a4-9e5c-02ac921467fa:wiki.example.com", decision: access, confidence: 1 }
expect: []
