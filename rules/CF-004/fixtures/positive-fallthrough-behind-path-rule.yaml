# Source: https://developers.cloudflare.com/api/resources/zero_trust/subresources/tunnels/subresources/cloudflared/subresources/configurations/methods/get/
# Origin parameters: https://developers.cloudflare.com/cloudflare-one/networks/connectors/cloudflare-tunnel/configure-tunnels/origin-parameters/#access
# Graph shape: docs/architecture/graph-contract.md, tunnel_hostname (rules without a hostname,
# via_fallthrough) and "Exposure semantics", item 4
# Review: docs/reviews/2026-10-30-security-review-round-3.md, R3-02 case B
description: >
  The ingress is [{hostname: app.example.com, path: ^/admin, access
  required}, {service: http://localhost:8080}]. cloudflared checks an Access
  token on /admin only; every other path of app.example.com falls through
  to the catch-all origin without a check. The collector emits that origin
  as a via_fallthrough node of app.example.com. No Access app covers the
  host, so the evaluator decides /admin access (origin-enforced, confidence
  1) and the fall-through node public. The finding is the fall-through
  node's.
nodes:
  - { type: tunnel, id: 7a6b5c4d-3e2f-4a1b-9c8d-7e6f5a4b3c2d, name: apps, props: { tunnel_type: cfd_tunnel, status: healthy, config_src: cloudflare } }
  - { type: tunnel_hostname, id: "7a6b5c4d-3e2f-4a1b-9c8d-7e6f5a4b3c2d:app.example.com^/admin", name: app.example.com, props: { hostname: app.example.com, path: "^/admin", service: "http://localhost:9000", origin_scheme: http, tunnel_id: 7a6b5c4d-3e2f-4a1b-9c8d-7e6f5a4b3c2d, access_required: true, via_fallthrough: false } }
  - { type: tunnel_hostname, id: "7a6b5c4d-3e2f-4a1b-9c8d-7e6f5a4b3c2d:app.example.com", name: app.example.com, props: { hostname: app.example.com, path: "", service: "http://localhost:8080", origin_scheme: http, tunnel_id: 7a6b5c4d-3e2f-4a1b-9c8d-7e6f5a4b3c2d, access_required: false, via_fallthrough: true } }
edges:
  - { type: ROUTES_TO, src: "tunnel_hostname:7a6b5c4d-3e2f-4a1b-9c8d-7e6f5a4b3c2d:app.example.com^/admin", dst: "tunnel:7a6b5c4d-3e2f-4a1b-9c8d-7e6f5a4b3c2d" }
  - { type: ROUTES_TO, src: "tunnel_hostname:7a6b5c4d-3e2f-4a1b-9c8d-7e6f5a4b3c2d:app.example.com", dst: "tunnel:7a6b5c4d-3e2f-4a1b-9c8d-7e6f5a4b3c2d" }
exposure:
  - { entry: "tunnel_hostname:7a6b5c4d-3e2f-4a1b-9c8d-7e6f5a4b3c2d:app.example.com^/admin", path: "/admin*", decision: access, confidence: 1 }
  - { entry: "tunnel_hostname:7a6b5c4d-3e2f-4a1b-9c8d-7e6f5a4b3c2d:app.example.com", decision: public, confidence: 2 }
expect:
  - { fingerprint: "CF-004:tunnel_hostname:7a6b5c4d-3e2f-4a1b-9c8d-7e6f5a4b3c2d:app.example.com", severity: high }
