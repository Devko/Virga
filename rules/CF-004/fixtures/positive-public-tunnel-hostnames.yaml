# Graph shape: docs/architecture/graph-contract.md, tunnel and tunnel_hostname
description: >
  Three published hostnames of one tunnel, all public. SSH and the bastion
  jump host are critical; the HTTP app is high. Only the /api path of the
  HTTP app is public, the rest sits behind Access. A second tunnel serves
  ssh.example.com as well; its hostname node is keyed by its own tunnel ID,
  so it is a finding of its own.
nodes:
  - { type: tunnel, id: c1744f8b-faa1-48a4-9e5c-02ac921467fa, name: office, props: { tunnel_type: cfd_tunnel, status: healthy, config_src: cloudflare } }
  - { type: tunnel_hostname, id: "c1744f8b-faa1-48a4-9e5c-02ac921467fa:ssh.example.com", name: ssh.example.com, props: { hostname: ssh.example.com, path: "", service: "ssh://localhost:22", origin_scheme: ssh, tunnel_id: c1744f8b-faa1-48a4-9e5c-02ac921467fa, access_required: false, via_fallthrough: false } }
  - { type: tunnel, id: 9e8d7c6b-5a4f-4e3d-8c2b-1a0f9e8d7c6b, name: office-dr, props: { tunnel_type: cfd_tunnel, status: healthy, config_src: cloudflare } }
  - { type: tunnel_hostname, id: "9e8d7c6b-5a4f-4e3d-8c2b-1a0f9e8d7c6b:ssh.example.com", name: ssh.example.com, props: { hostname: ssh.example.com, path: "", service: "ssh://10.1.0.4:22", origin_scheme: ssh, tunnel_id: 9e8d7c6b-5a4f-4e3d-8c2b-1a0f9e8d7c6b, access_required: false, via_fallthrough: false } }
  - { type: tunnel_hostname, id: "c1744f8b-faa1-48a4-9e5c-02ac921467fa:jump.example.com", name: jump.example.com, props: { hostname: jump.example.com, path: "", service: bastion, origin_scheme: other, tunnel_id: c1744f8b-faa1-48a4-9e5c-02ac921467fa, access_required: false, via_fallthrough: false } }
  - { type: tunnel_hostname, id: "c1744f8b-faa1-48a4-9e5c-02ac921467fa:app.example.com", name: app.example.com, props: { hostname: app.example.com, path: "", service: "http://localhost:8080", origin_scheme: http, tunnel_id: c1744f8b-faa1-48a4-9e5c-02ac921467fa, access_required: false, via_fallthrough: false } }
