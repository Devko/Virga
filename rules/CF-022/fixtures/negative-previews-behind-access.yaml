# Source: https://developers.cloudflare.com/api/resources/pages/subresources/projects/methods/get/
# Graph shape: docs/architecture/graph-contract.md, pages_preview and exposure
description: >
  Previews share the production database, but an Access app covers the
  preview wildcard. The evaluator could not decide the previews of a second
  project, but they bind nothing that production binds, so that project
  would not qualify even if they were public.
nodes:
  - { type: pages_project, id: shop, name: shop, props: { production_branch: main, subdomain: shop.pages.dev, preview_deployments: all } }
  - { type: pages_preview, id: "*.shop.pages.dev", name: "*.shop.pages.dev", props: { project: shop } }
  - { type: pages_project, id: blog, name: blog, props: { production_branch: main, subdomain: blog.pages.dev, preview_deployments: custom } }
  - { type: pages_preview, id: "*.blog.pages.dev", name: "*.blog.pages.dev", props: { project: blog } }
  - { type: d1_database, id: db-prod, name: prod }
  - { type: d1_database, id: db-blog-preview, name: blog-preview }
edges:
  - { type: ROUTES_TO, src: "pages_preview:*.shop.pages.dev", dst: "pages_project:shop", props: { environment: preview } }
  - { type: ROUTES_TO, src: "pages_preview:*.blog.pages.dev", dst: "pages_project:blog", props: { environment: preview } }
  - { type: BINDS, src: "pages_project:shop", dst: "d1_database:db-prod", key: "production:DB", props: { binding_type: d1, environment: production } }
  - { type: BINDS, src: "pages_project:shop", dst: "d1_database:db-prod", key: "preview:DB", props: { binding_type: d1, environment: preview } }
  - { type: BINDS, src: "pages_project:blog", dst: "d1_database:db-prod", key: "production:DB", props: { binding_type: d1, environment: production } }
  - { type: BINDS, src: "pages_project:blog", dst: "d1_database:db-blog-preview", key: "preview:DB", props: { binding_type: d1, environment: preview } }
exposure:
  - { entry: "pages_preview:*.shop.pages.dev", decision: access, confidence: 1 }
  - { entry: "pages_preview:*.blog.pages.dev", decision: unknown, confidence: 0 }
expect: []
